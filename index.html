<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma'ariful Qur'an Interactive Reader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#CD7743" />
    <meta name="description" content="An interactive digital exegesis of Ma'ariful Qur'an by Mufti Muhammad Shafi with KFGQPC Uthmanic Arabic typography, dual block/combined views, curated theological vocabulary popovers, and thematic navigation." />
    <meta property="og:title" content="Ma'ariful Qur'an Interactive Reader" />
    <meta property="og:description" content="An interactive digital exegesis of Ma'ariful Qur'an by Mufti Muhammad Shafi with KFGQPC Uthmanic Arabic typography, dual block/combined views, curated theological vocabulary popovers, and thematic navigation." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Immediate Theme Application to prevent Dark Mode Flash (FOUC) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('maariful_theme');
          if (t === 'charcoal') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#18181A';
          }
        } catch (_) {}
      })();
    </script>

    <!-- Preconnect CDN for KFGQPC Uthmanic Arabic Font & Google Fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F7F4] text-[#1F2937] antialiased selection:bg-amber-200 selection:text-amber-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
